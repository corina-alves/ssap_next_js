# Ambiente independente: não combine com compose.yaml.
# sh docker/preparar-dev.sh
# docker compose --env-file .env.dev -f compose.dev.yaml up -d --build
name: ssap-dev

x-app: &app
  build:
    context: .
    target: dev
  image: ssap-dev:local
  user: '${DEV_UID:-1000}:${DEV_GID:-1000}'
  init: true
  env_file: .env.dev
  environment:
    NODE_ENV: development
    APP_URL: ${APP_URL:-http://localhost:3001/ssap}
    TRUST_PROXY: 'false'
    DATABASE_URL: ''
    DB_HOST: db
    DB_PORTA: '5432'
    DB_NOME: ssap
    DB_USUARIO: ssap_app
    DB_SENHA_ARQUIVO: /run/secrets/app_db_password
    DB_SSL_MODE: disable
    STORAGE_DIR: /dados/storage
    CACHE_DIR: /dados/cache
    NPM_CONFIG_CACHE: /npm-cache
  secrets: [app_db_password]
  volumes:
    - .:/app
    - dev_node_modules:/app/node_modules
    - dev_next:/app/.next
    - dev_npm_cache:/npm-cache
    - arquivos:/dados/storage
    - cache:/dados/cache
  security_opt:
    - no-new-privileges:true
    - seccomp=./docker/chromium-seccomp.json
  cap_drop: [ALL]
  shm_size: 256mb
  healthcheck:
    disable: true

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ssap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_USER: ssap_app
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    secrets: [postgres_password, app_db_password]
    ports:
      - '127.0.0.1:${DB_PORTA_LOCAL:-5433}:5432'
    volumes:
      - banco:/var/lib/postgresql
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  permissoes:
    build:
      context: .
      target: dev
    image: ssap-dev:local
    user: root
    restart: 'no'
    network_mode: none
    environment:
      DEV_UID: ${DEV_UID:-1000}
      DEV_GID: ${DEV_GID:-1000}
    entrypoint: [sh, -c, 'chown -R "$$DEV_UID:$$DEV_GID" /app/node_modules /app/.next /npm-cache /dados/storage /dados/cache']
    volumes:
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
      - dev_npm_cache:/npm-cache
      - arquivos:/dados/storage
      - cache:/dados/cache
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]

  migracoes:
    <<: *app
    restart: 'no'
    command: [sh, /usr/local/bin/dev-comando, npm, run, db:migrar]
    depends_on:
      db:
        condition: service_healthy
      permissoes:
        condition: service_completed_successfully

  app:
    <<: *app
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORTA:-3001}:3000'
    command: [sh, /usr/local/bin/dev-comando, npm, run, dev, --, --hostname, 0.0.0.0]
    mem_limit: 3g
    pids_limit: 256
    depends_on:
      migracoes:
        condition: service_completed_successfully

volumes:
  banco:
  arquivos:
  cache:
  dev_node_modules:
  dev_next:
  dev_npm_cache:

secrets:
  postgres_password:
    file: ./secrets/dev/postgres_password.txt
  app_db_password:
    file: ./secrets/dev/app_db_password.txt
