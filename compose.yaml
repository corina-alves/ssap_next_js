# Produção Ubuntu: PostgreSQL e Nginx são serviços já existentes.
# Use sempre: docker compose --env-file .env.docker ...
# Migrações são uma operação explícita, antes de iniciar/atualizar a aplicação.
name: sala-situacao

x-logs: &logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-protegido: &protegido
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logs

x-ambiente: &ambiente
  env_file: .env.docker
  environment:
    NODE_ENV: production
    APP_URL: ${APP_URL:?defina APP_URL=https://seu-dominio/ssap em .env.docker}
    TRUST_PROXY: 'true'
    DATABASE_URL: '' # entrada monta a URL em runtime; não aceita credenciais do env_file
    SAISP_SENHA: '' # segredo opcional é lido por SAISP_SENHA_ARQUIVO
    DB_HOST: ${DB_HOST:?defina o host do PostgreSQL existente em .env.docker}
    DB_PORTA: ${DB_PORTA:-5432}
    DB_NOME: ${DB_NOME:?defina DB_NOME em .env.docker}
    DB_USUARIO: ${DB_USUARIO:?defina um usuario de aplicacao em .env.docker}
    DB_SENHA_ARQUIVO: /run/secrets/app_db_password
    DB_SSL_MODE: ${DB_SSL_MODE:-verify-full}
    STORAGE_DIR: /dados/storage
    CACHE_DIR: /dados/cache
  secrets: [app_db_password]
  extra_hosts: [host.docker.internal:host-gateway]
  networks: [aplicacao]

services:
  permissoes:
    image: node:24.21.0-bookworm-slim
    restart: 'no'
    user: root
    network_mode: none
    entrypoint: [chown, '1000:1000', /dados/storage, /dados/cache]
    volumes:
      - arquivos:/dados/storage
      - cache:/dados/cache
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    logging: *logs

  app:
    <<: [*ambiente, *protegido]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/chromium-seccomp.json
    build:
      context: .
      target: app
    image: ssap-app:${APP_VERSAO:-local}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORTA:-3000}:3000'
    volumes:
      - arquivos:/dados/storage
      - cache:/dados/cache
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1770,size=512m
      - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=256m
    shm_size: 256mb
    pids_limit: 256
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      permissoes:
        condition: service_completed_successfully

  ferramentas:
    <<: [*ambiente, *protegido]
    profiles: [ferramentas]
    build:
      context: .
      target: ferramentas
    image: ssap-ferramentas:${APP_VERSAO:-local}
    restart: 'no'
    command: [npm, run, db:migrar]
    volumes:
      - arquivos:/dados/storage
      - cache:/dados/cache
    read_only: true
    tmpfs: ['/tmp:uid=1000,gid=1000,mode=1770,size=128m']
    depends_on:
      permissoes:
        condition: service_completed_successfully

  backup:
    <<: *protegido
    profiles: [manutencao]
    image: postgres:18.6
    restart: 'no'
    user: '1000:1000'
    env_file: .env.docker
    environment:
      DB_SENHA_ARQUIVO: /run/secrets/app_db_password
      PGSSLMODE: ${DB_SSL_MODE:-verify-full}
      PGSSLROOTCERT: ${DB_SSL_CA_ARQUIVO:-}
      TZ: America/Sao_Paulo
      BACKUP_MANTER_DIAS: ${BACKUP_MANTER_DIAS:-}
    secrets: [app_db_password]
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [aplicacao]
    read_only: true
    tmpfs: ['/tmp:uid=1000,gid=1000,mode=1770,size=128m']
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - arquivos:/dados/storage:ro
      - ./backups:/backups
    entrypoint: [sh, /usr/local/bin/backup.sh]

  restaurar:
    <<: *protegido
    profiles: [manutencao]
    image: postgres:18.6
    restart: 'no'
    user: '1000:1000'
    env_file: .env.docker
    environment:
      DB_SENHA_ARQUIVO: /run/secrets/app_db_password
      PGSSLMODE: ${DB_SSL_MODE:-verify-full}
      PGSSLROOTCERT: ${DB_SSL_CA_ARQUIVO:-}
      TZ: America/Sao_Paulo
      CONFIRMAR: ${CONFIRMAR:-}
    secrets: [app_db_password]
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [aplicacao]
    read_only: true
    tmpfs: ['/tmp:uid=1000,gid=1000,mode=1770,size=128m']
    volumes:
      - ./docker/restaurar.sh:/usr/local/bin/restaurar.sh:ro
      - arquivos:/dados/storage
      - ./backups:/backups:ro
    entrypoint: [sh, /usr/local/bin/restaurar.sh]
    depends_on:
      permissoes:
        condition: service_completed_successfully

networks:
  aplicacao:

volumes:
  arquivos:
  cache:

secrets:
  app_db_password:
    file: ${DB_SENHA_HOST_ARQUIVO:-./secrets/app_db_password.txt}
